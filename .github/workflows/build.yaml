on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build Snap
    runs-on: [self-hosted, linux, X64, jammy, large]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: snapcore/action-build@v1
        id: build
      - name: Upload locally built Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-artifact
          path: ${{ steps.build.outputs.snap }}
