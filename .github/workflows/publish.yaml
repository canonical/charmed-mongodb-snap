on:
  push:
    branches:
      - "[0-9]/[a-z]+"
      - "8-transition/[a-z]+"
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build snap
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v29.0.5
  publish:
    name: Publish Snap
    needs: build
    uses: canonical/data-platform-workflows/.github/workflows/release_snap.yaml@v29.0.5
    with:
      channel: 8/edge
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
    secrets:
      snap-store-token: ${{ secrets.STORE_LOGIN }}
    permissions:
      contents: write
